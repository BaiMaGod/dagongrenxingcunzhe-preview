name: LayaAir 3.4 免费构建与 Pages 发布

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-laya-pages.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: "通过全部构建/浏览器烟测后部署 GitHub Pages"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dagongren-laya-pages
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Require read-only token for private source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.DAGONGREN_SOURCE_READ_TOKEN }}
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo "::error::Set DAGONGREN_SOURCE_READ_TOKEN with Contents:Read on private source repo in this public preview repo."
            exit 1
          fi

      - name: Checkout private source without persisting token
        uses: actions/checkout@v4
        with:
          repository: BaiMaGod/dagongrenxingcunzhe
          # Ordinary-month pacing release candidate: exact Boss HUD automation substring restored; build latest source.
          ref: dev/m9-laya-build
          path: private-game
          token: ${{ secrets.DAGONGREN_SOURCE_READ_TOKEN }}
          persist-credentials: false

      - name: Record exact private-source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git -C private-game rev-parse HEAD)"
          test "${#SHA}" -eq 40
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building private game commit $SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Includes the four-corner LayaAir 3.4 drawRoundRect rendering contract guard for every View, including legacy M1.
      - name: Typecheck, game regression and source/template bridge tests
        id: source-tests
        working-directory: private-game
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          python3 tools/test_laya_prepare.py

      # Release gate: 40 seeded trials, role-specific melee engagement and restored ranged/newcomer kiting.
      - name: Full-strength ordinary-month AI playtests
        id: ordinary-ai
        working-directory: private-game
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          node .test-dist/tests/ordinary_playtest_probe.js assets/config/mvp-balance.v0.3.json > "$RUNNER_TEMP/ordinary-ai.json"
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"ordinary-ai.json").read_text())
          assert r["kind"]=="ordinary-full-intensity-ai-playtest" and r["gameSeconds"]==480
          assert r["fullSpawn"] and r["fullBossHp"] and not r["modifiedConfig"] and not r["debugInvulnerability"]
          assert len(r["samples"])==42 and len(r["statistics"])==4
          assert {s["role"] for s in r["samples"]}=={"student","tea_worker","security","screw_worker"}
          assert all(s["outcome"] in ("win","dead","timeout") and 0<s["seconds"]<=480 for s in r["samples"])
          assert all(s["salary"]-s["spent"]==s["remaining"] for s in r["samples"])
          assert all(s["bossCombat"]["damage"]>=0 and 0<=s["bossCombat"]["rangePct"]<=100 for s in r["samples"])
          assert all(s["bossCombat"]["damage"]==sum(s["bossCombat"]["damageBySource"].values()) for s in r["samples"])
          assert len([s for s in r["samples"] if s["assist"]])==2
          assert all(s["outcome"]=="win" for s in r["samples"] if s["assist"]), "First-clear assisted newcomers regressed"
          for row in r["statistics"]: print("AI playtest (not human):",row)
          print("First-clear assistant samples:",[(s["seed"],s["outcome"]) for s in r["samples"] if s["assist"]])
          PY
          echo "### Actual full-strength ordinary-month AI playtests (not human win rates)" >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"ordinary-ai.json").read_text());print("| Role | Plays | Wins | Boss reached | First level (s) | Final Lv | Survived (s) |\n|---|---:|---:|---:|---:|---:|---:|");[print("| {role} | {plays} | {wins} | {bossReached} | {meanFirstUpgradeSeconds} | {meanLevelAtEnd} | {meanSurvivalSeconds} |".format(**x)) for x in r["statistics"]]' >> "$GITHUB_STEP_SUMMARY"

      - name: 180 virtual seconds capped-swarm CPU logic stress
        id: logic-stress
        working-directory: private-game
        shell: bash
        run: |
          set -euo pipefail
          node .test-dist/tests/stress_probe.js > "$RUNNER_TEMP/stress-180s.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"stress-180s.json"
          r=json.loads(p.read_text())
          assert r["kind"]=="logic-only-synthetic-stress",r
          assert r["gameSeconds"]==180 and r["steps"]==10800,r
          assert r["capsPassed"] and r["observed"]["maxEnemies"]==450,r
          assert r["final"]["kills"]==0 and all(p["enemies"]==450 for p in r["checkpoints"]),r
          assert r["realtimeDeviceFpsMeasured"] is False,r
          print("180 virtual seconds / 10800 ticks checked:",r["cpuPerStepMs"],r["observed"])
          PY
          echo "### Logic-only synthetic 180-second battle stress" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/stress-180s.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Full 480-second month salary/shop/Boss/settlement regression
        id: month-logic
        working-directory: private-game
        shell: bash
        run: |
          set -euo pipefail
          node .test-dist/tests/full_month_probe.js assets/config/mvp-balance.v0.3.json > "$RUNNER_TEMP/full-month.json"
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"full-month.json").read_text())
          assert r["kind"]=="full-month-calendar-and-settlement-logic" and r["ticks"]==28800,r
          assert r["end"]["outcome"]=="win" and r["settlement"]["timeoutCredit"]==0,r
          assert [x["day"] for x in r["shops"]]==[10,20],r
          assert r["boss"]["spawnTick"]==24960 and 24960<r["boss"]["defeatTick"]<28800,r
          assert r["settlement"]["winCredit"]==r["wage"]["remaining"],r
          print("Full 480 second real-config calendar/settlement verified",r["wage"],r["boss"])
          PY
          echo "### Full month contract (accelerated, QA-only fixture)" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/full-month.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Rasterize illustrated combat atlas and synthesize event WAV
        id: game-assets
        working-directory: private-game
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir 'cairosvg==2.7.1' 'Pillow==11.3.0'
          python3 tools/render_combat_art.py
          python3 tools/generate_anim_atlas.py
          python3 tools/generate_combat_sfx.py
          test -s assets/art/combat-atlas.webp
          test -s assets/art/actors-motion.webp
          test -s assets/art/combat-motion.webp
          test -s assets/art/city-floor.webp
          for cue in hit kill hurt salary boss boss_down upgrade shot; do
            test -s "assets/audio/$cue.wav"
          done
          echo "Combat atlas, 96 cropped pre-rendered pose frames, city floor and eight event sounds generated" >> "$GITHUB_STEP_SUMMARY"

      - name: Install official LayaAir CLI 3.4.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/layabox/layaair-cli/master/install.sh -o "$RUNNER_TEMP/install-layaair.sh"
          LAYAAIR_INSTALL_DIR="$RUNNER_TEMP/layaair" bash "$RUNNER_TEMP/install-layaair.sh"
          echo "$RUNNER_TEMP/layaair" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/layaair/layaair" install 3.4.0
          "$RUNNER_TEMP/layaair/layaair" --version=3.4.0 create --list-templates | grep -F "2D empty project"

      - name: Create original 2D template, bind game and compile genuine Web build
        id: laya-build
        working-directory: private-game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/official-laya-project"
          layaair --version=3.4.0 create Dagongren -t "2D empty project" -p "$RUNNER_TEMP/official-laya-project"
          echo "=== OFFICIAL 2D TEMPLATE FILES ==="
          find "$RUNNER_TEMP/official-laya-project" -maxdepth 4 -type f | sort | head -130
          echo "=== PLAYER SETTINGS ==="
          cat "$RUNNER_TEMP/official-laya-project/settings/PlayerSettings.json"
          echo "=== PROJECT INIT SETTINGS ==="
          cat "$RUNNER_TEMP/official-laya-project/Dagongren.laya"
          echo "=== COMPILER/STARTUP CANDIDATES ==="
          find "$RUNNER_TEMP/official-laya-project" -type f \( -name '*Compiler*' -o -name '*Main*' -o -name '*.laya' \) | sort
          python3 tools/prepare_laya_project.py --repo "$PWD" --project "$RUNNER_TEMP/official-laya-project"
          layaair --version=3.4.0 build web -p "$RUNNER_TEMP/official-laya-project" -o "$RUNNER_TEMP/game-web"
          test -s "$RUNNER_TEMP/game-web/index.html"
          test -n "$(find "$RUNNER_TEMP/game-web" -type f -name '*.js' -size +0c -print -quit)"
          mkdir -p "$RUNNER_TEMP/game-web/config"
          cp assets/config/mvp-balance.v0.3.json "$RUNNER_TEMP/game-web/config/"
          test -s "$RUNNER_TEMP/game-web/config/mvp-balance.v0.3.json"
          # Asset bytes are packaged only after their actual Git upload.
          # Source PNG/design docs never get copied into public runtime output.
          if [ -s assets/art/actors-atlas.webp ]; then
            mkdir -p "$RUNNER_TEMP/game-web/art"
            cp assets/art/actors-atlas.webp "$RUNNER_TEMP/game-web/art/actors-atlas.webp"
            test -s "$RUNNER_TEMP/game-web/art/actors-atlas.webp"
            echo "Real actor texture atlas included" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Actor atlas absent; view must retain explicitly marked prototype art" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Real combat art/sound assets: generated above from private source assets.
          test -s assets/art/combat-atlas.webp
          test -s assets/art/city-floor.webp
          mkdir -p "$RUNNER_TEMP/game-web/art" "$RUNNER_TEMP/game-web/audio"
          cp assets/art/combat-atlas.webp "$RUNNER_TEMP/game-web/art/"
          cp assets/art/actors-motion.webp "$RUNNER_TEMP/game-web/art/"
          cp assets/art/combat-motion.webp "$RUNNER_TEMP/game-web/art/"
          cp assets/art/city-floor.webp "$RUNNER_TEMP/game-web/art/"
          cp assets/audio/*.wav "$RUNNER_TEMP/game-web/audio/"
          test -s "$RUNNER_TEMP/game-web/art/combat-atlas.webp"
          test -s "$RUNNER_TEMP/game-web/art/actors-motion.webp"
          test -s "$RUNNER_TEMP/game-web/art/combat-motion.webp"
          test -s "$RUNNER_TEMP/game-web/art/city-floor.webp"
          test -s "$RUNNER_TEMP/game-web/audio/kill.wav"

      - name: Manifest and public artifact hygiene checks
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          output=pathlib.Path(os.environ["RUNNER_TEMP"])/"game-web"
          forbidden=["src","docs","tools",".git","node_modules","private-game"]
          for item in forbidden:
              if (output/item).exists(): raise SystemExit("Private path in Web artifact: "+item)
          manifest={"schemaVersion":1,"commitSha":os.environ["SOURCE_SHA"],"engineVersion":"3.4.0","target":"web"}
          (output/"build-manifest.json").write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")
          assert len(manifest["commitSha"])==40
          print("Staged only Laya Web build from:",manifest["commitSha"])
          PY

      - name: Install Chromium for actual browser smoke
        shell: bash
        run: |
          python3 -m pip install 'playwright==1.55.0'
          python3 -m playwright install --with-deps chromium

      - name: Desktop and mobile portrait smoke and screenshots
        id: browser-qa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/game-web" > "$RUNNER_TEMP/qa/http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4173/config/mvp-balance.v0.3.json > /dev/null
          curl -fsS http://127.0.0.1:4173/art/combat-atlas.webp > /dev/null
          curl -fsS http://127.0.0.1:4173/art/actors-motion.webp > /dev/null
          curl -fsS http://127.0.0.1:4173/art/combat-motion.webp > /dev/null
          curl -fsS http://127.0.0.1:4173/art/city-floor.webp > /dev/null
          for cue in hit kill hurt salary boss boss_down upgrade shot; do
            curl -fsS "http://127.0.0.1:4173/audio/$cue.wav" > /dev/null
          done
          python3 - <<'PY'
          import asyncio,os,pathlib
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  for name,size,mobile in [
                      ("desktop",{"width":1280,"height":800},False),
                      ("mobile-portrait",{"width":390,"height":844},True)]:
                      ctx=await browser.new_context(viewport=size,device_scale_factor=1,is_mobile=mobile,has_touch=mobile)
                      page=await ctx.new_page()
                      errors=[]
                      info_logs=[]
                      page.on("pageerror",lambda error:errors.append(str(error)))
                      page.on("console",lambda message:info_logs.append(message.text))
                      response=await page.goto("http://127.0.0.1:4173/",wait_until="domcontentloaded")
                      assert response and response.status==200
                      await page.wait_for_selector("canvas",timeout=30000)
                      await page.wait_for_timeout(8000)
                      dom=await page.evaluate("""() => ({viewport:[window.innerWidth,window.innerHeight],bodySize:[document.body.clientWidth,document.body.clientHeight],
                        layerInfo:[...document.body.children].map(el=>({tag:el.tagName,id:el.id,cls:el.className,display:getComputedStyle(el).display,visibility:getComputedStyle(el).visibility,opacity:Number(getComputedStyle(el).opacity),rect:[el.getBoundingClientRect().width,el.getBoundingClientRect().height]})).slice(0,18),
                        stageScale:window.Laya&&window.Laya.stage?window.Laya.stage.scaleMode:null})""")
                      print(name,"dom and adaptation",dom)
                      canvas=await page.locator("canvas").first.evaluate("(el)=>({w:el.width,h:el.height})")
                      assert canvas["w"]>0 and canvas["h"]>0,(name,canvas)
                      stage=await page.evaluate("""() => {
                        const l=window.Laya,stage=l&&l.stage,texts=[];
                        const walk=(node,depth)=>{
                          if(!node||depth>15||texts.length>150)return;
                          if(typeof node.text==="string"&&node.text.trim())texts.push(node.text.slice(0,180));
                          const n=Number(node.numChildren)||0;
                          if(typeof node.getChildAt==="function")for(let i=0;i<Math.min(n,100);i++)walk(node.getChildAt(i),depth+1);
                        };
                        walk(stage,0);
                        return {laya:!!l,stage:!!stage,stageW:stage?.width??null,stageH:stage?.height??null,stageChildren:stage?.numChildren??null,texts};
                      }""")
                      print(name,"game stage snapshot",stage)
                      actor_atlas=await page.evaluate("""() => {
                        const t=window.Laya?.loader?.getRes("art/actors-atlas.webp");
                        return {exists:!!t,width:Number(t?.width)||0,height:Number(t?.height)||0};
                      }""")
                      print(name,"real actor asset",actor_atlas)
                      assert actor_atlas["exists"] and actor_atlas["width"]>=352 and actor_atlas["height"]>=176,(name,"worker/monster atlas missing at runtime",actor_atlas,info_logs)
                      assert any("[art] High-quality character atlas loaded" in m for m in info_logs),(name,"atlas art mapping did not successfully preload",info_logs)
                      combat_asset=await page.evaluate("""() => {
                        const loader=window.Laya?.loader;
                        const t=loader?.getRes("art/combat-atlas.webp");
                        const f=loader?.getRes("art/city-floor.webp");
                        const am=loader?.getRes("art/actors-motion.webp");
                        const cm=loader?.getRes("art/combat-motion.webp");
                        return {combat:!!t,combatWidth:Number(t?.width)||0,combatHeight:Number(t?.height)||0,
                          floor:!!f,floorWidth:Number(f?.width)||0,floorHeight:Number(f?.height)||0,
                          actorsMotion:!!am,actorsMotionSize:[Number(am?.width)||0,Number(am?.height)||0],
                          combatMotion:!!cm,combatMotionSize:[Number(cm?.width)||0,Number(cm?.height)||0]};
                      }""")
                      print(name,"illustrated combat and floor textures",combat_asset)
                      assert combat_asset["combat"] and combat_asset["combatWidth"]==512 and combat_asset["combatHeight"]==512,(name,"combat atlas missing",combat_asset)
                      assert combat_asset["floor"] and combat_asset["floorWidth"]==256 and combat_asset["floorHeight"]==256,(name,"floor texture missing",combat_asset)
                      assert combat_asset["actorsMotion"] and combat_asset["actorsMotionSize"]==[352,704],(name,"32 actor motion frames missing",combat_asset)
                      assert combat_asset["combatMotion"] and combat_asset["combatMotionSize"]==[512,2048],(name,"64 combat motion frames missing",combat_asset)
                      assert any("[art] Battle combat sprites, four-frame animation atlases" in m for m in info_logs),(name,"four-frame animation atlas did not preload",info_logs)

                      await page.screenshot(path=str(pathlib.Path(os.environ["RUNNER_TEMP"])/"qa"/(name+".png")),full_page=True)
                      assert stage["stageW"] is not None and stage["stageH"] is not None,(name,"Laya Stage dimensions absent",stage)
                      if stage["stageW"]!=size["width"] or stage["stageH"]!=size["height"]:
                          print(name,"STAGE DIMENSIONS NEED REVIEW: ",stage["stageW"],stage["stageH"],"vs",size)
                      assert not errors,(name,errors)
                      assert any("本月开工准备" in t for t in stage["texts"]),(name,"Game home UI missing",stage)
                      splash=dom["layerInfo"]
                      assert not any(x["id"]=="splash" and x["display"]!="none" and x["visibility"]!="hidden" and x["opacity"]>0.05 for x in splash),(name,"Laya default splash obstructs actual game",dom)
                      print(name,"actual game home verified",canvas)
                      async def click_laya_label(label):
                          point=await page.evaluate("""(targetText) => {
                            const stage=window.Laya.stage;
                            let found=null;
                            const walk=(node,depth)=>{
                              if(found||!node||depth>15)return;
                              if(typeof node.text==="string"&&node.text===targetText){found=node;return;}
                              const n=Number(node.numChildren)||0;
                              if(typeof node.getChildAt==="function")for(let i=0;i<Math.min(n,100);i++)walk(node.getChildAt(i),depth+1);
                            };
                            walk(stage,0);
                            if(!found)return null;
                            const width=Math.max(20,Number(found.width)||Number(found.textWidth)||80);
                            const height=Math.max(18,Number(found.height)||Number(found.textHeight)||28);
                            const p=found.localToGlobal(new window.Laya.Point(width/2,height/2));
                            return {x:p.x,y:p.y,stageW:stage.width,stageH:stage.height};
                          }""",label)
                          assert point,(name,"click label missing",label)
                          rect=await page.locator("canvas").first.bounding_box()
                          assert rect and rect["width"]>0,(name,"canvas bounding box missing")
                          x=rect["x"]+point["x"]*rect["width"]/point["stageW"]
                          y=rect["y"]+point["y"]*rect["height"]/point["stageH"]
                          top=await page.evaluate("([x,y])=>{const e=document.elementFromPoint(x,y);return e?{tag:e.tagName,id:e.id,cls:e.className,rect:[e.getBoundingClientRect().x,e.getBoundingClientRect().y,e.getBoundingClientRect().width,e.getBoundingClientRect().height]}:null}",[x,y])
                          print(name,"click",label,{"stage":point,"client":{"x":x,"y":y},"topDOM":top})
                          if mobile:await page.touchscreen.tap(x,y)
                          else:await page.mouse.click(x,y)

                      async def read_laya_texts():
                          return await page.evaluate("""() => {
                            const out=[],walk=(node,depth)=>{
                              if(!node||depth>15||out.length>150)return;
                              if(typeof node.text==="string"&&node.text.trim())out.push(node.text.slice(0,200));
                              if(typeof node.getChildAt==="function")for(let i=0;i<Math.min(node.numChildren||0,100);i++)walk(node.getChildAt(i),depth+1);
                            };
                            walk(window.Laya.stage,0);return out;
                          }""")

                      await click_laya_label("普通月")
                      for _ in range(20):
                          await page.wait_for_timeout(200)
                          if any("本月高发：" in t for t in await read_laya_texts()):break
                      else:raise AssertionError((name,"select ordinary month did not lock risk draft",await read_laya_texts()))
                      await click_laya_label("开工")
                      for _ in range(30):
                          await page.wait_for_timeout(200)
                          if any("480 秒" in t and "HP " in t for t in await read_laya_texts()):break
                      else:raise AssertionError((name,"profession start did not enter battle",await read_laya_texts()))
                      # Initial monsters have a short spawn telegraph. Capture after activation,
                      # otherwise the screenshot can misleadingly depict only the telegraph art.
                      await page.wait_for_timeout(1650)
                      active_texts=await read_laya_texts()
                      assert any("480 秒" in t and "HP " in t for t in active_texts),(name,"game exited unexpectedly",active_texts)
                      await page.screenshot(path=str(pathlib.Path(os.environ["RUNNER_TEMP"])/"qa"/(name+"-playing.png")),full_page=True)
                      print(name,"live 1.65s combat render captured after spawn telegraph")

                      # Verify pause freezes game time and resume removes the menu; record both layouts.
                      def battle_clock(texts):
                          import re
                          for t in texts:
                              m=re.search(r"(\d+(?:\.\d+)?)/480 秒",t)
                              if m:return float(m.group(1))
                          return None
                      await click_laya_label("暂停")
                      for _ in range(15):
                          await page.wait_for_timeout(150)
                          if "已暂停" in await read_laya_texts():break
                      else:raise AssertionError((name,"pause UI missing",await read_laya_texts()))
                      paused_clock=battle_clock(await read_laya_texts())
                      await page.wait_for_timeout(600)
                      assert paused_clock is not None and battle_clock(await read_laya_texts())==paused_clock,(name,"logic clock advanced while manually paused")
                      await page.screenshot(path=str(pathlib.Path(os.environ["RUNNER_TEMP"])/"qa"/(name+"-paused.png")),full_page=True)
                      await click_laya_label("继续上班")
                      for _ in range(15):
                          await page.wait_for_timeout(150)
                          if "已暂停" not in await read_laya_texts():break
                      else:raise AssertionError((name,"resume UI still visible"))
                      print(name,"manual pause / frozen game clock / resume verified")

                      # In a SEPARATE practice-only browser scenario, render the actual
                      # Boss and a later charge. This never starts a formal or paying run.
                      response=await page.goto("http://127.0.0.1:4173/?qa_scenario=boss",wait_until="domcontentloaded")
                      assert response and response.status==200
                      await page.wait_for_selector("canvas",timeout=30000)
                      await page.wait_for_timeout(3600)
                      qa_initial=await read_laya_texts()
                      assert any("本月开工准备" in t for t in qa_initial),(name,"Boss QA initial screen missing",qa_initial)
                      assert any("[QA] Boss preview: isolated practice mode" in m for m in info_logs),(name,"Boss mode not isolated",info_logs)
                      await click_laya_label("普通月")
                      for _ in range(20):
                          await page.wait_for_timeout(200)
                          if any("本月高发：" in t for t in await read_laya_texts()):break
                      else:raise AssertionError((name,"Boss scenario setup did not select risk"))
                      await click_laya_label("开工")
                      for _ in range(30):
                          await page.wait_for_timeout(200)
                          if any("480 秒" in t and "HP " in t for t in await read_laya_texts()):break
                      else:raise AssertionError((name,"Boss practice did not start",await read_laya_texts()))
                      await page.wait_for_timeout(1700)
                      practice_texts=await read_laya_texts()
                      assert any("练习模式 · 不发奖" in t for t in practice_texts),(name,"QA must never grant formal payouts",practice_texts)
                      assert any("房租催缴 · HP" in t for t in practice_texts),(name,"Boss HUD text missing",practice_texts)
                      banner_visible=await page.evaluate("""() => {
                        let found=null;
                        const visit=n=>{
                          if(!n||found)return;
                          if(typeof n.text==="string"&&n.text.includes("房租催缴 · HP")){found=n;return;}
                          for(let i=0;i<Math.min(n.numChildren||0,100);i++)visit(n.getChildAt(i));
                        };
                        visit(window.Laya.stage);
                        return !!found && found.parent?.visible === true && found.parent?.parent?.visible !== false;
                      }""")
                      assert banner_visible,(name,"Boss HP panel not visible")
                      assert not errors,(name,"errors in Boss practice",errors)
                      await page.screenshot(path=str(pathlib.Path(os.environ["RUNNER_TEMP"])/"qa"/("boss-"+name+".png")),full_page=True)
                      await page.wait_for_timeout(1050)
                      assert any("房租催缴 · HP" in t for t in await read_laya_texts()),(name,"Boss died/disappeared in charge QA")
                      await page.screenshot(path=str(pathlib.Path(os.environ["RUNNER_TEMP"])/"qa"/("boss-"+name+"-charge.png")),full_page=True)
                      print(name,"Boss actual scene + warning/charge screenshots, no-payout practice verified")

                      # The new month route is ALWAYS practice, never reads player
                      # persistence. It executes actual simulation ticks under a
                      # deterministic no-random-enemies fixture and verifies actual UI.
                      res=await page.goto("http://127.0.0.1:4173/?qa_scenario=month",wait_until="domcontentloaded")
                      assert res and res.status==200
                      await page.wait_for_timeout(4100)
                      assert any("本月开工准备" in t for t in await read_laya_texts()),(name,"month QA home not rendered")
                      await click_laya_label("普通月")
                      for _ in range(20):
                          await page.wait_for_timeout(200)
                          if any("本月高发：" in t for t in await read_laya_texts()):break
                      else:raise AssertionError((name,"month QA ordinary risk not selected"))
                      await click_laya_label("开工")
                      for _ in range(30):
                          await page.wait_for_timeout(200)
                          if any("480 秒" in t and "HP " in t for t in await read_laya_texts()):break
                      else:raise AssertionError((name,"month QA battle not started"))
                      async def fastforward(tick):
                          return await page.evaluate("""tick => {
                            if(!window.__DG_MONTH_QA__?.advanceTo)throw Error("Practice-only calendar controller missing");
                            return window.__DG_MONTH_QA__.advanceTo(tick);
                          }""",tick)
                      day10=await fastforward(8640)
                      assert day10["tick"]==8640 and day10["shopDay"]==10,(name,"Day10 salary+shop failed",day10)
                      assert day10["salaryPaid"] and day10["cash"]==3000,(name,"Day10 wage incorrect",day10)
                      texts=await read_laya_texts()
                      assert any("工资商城" in t for t in texts),(name,"real salary shop screen missing",texts)
                      assert any("练习模式 · 不发奖" in t for t in texts),(name,"month QA was not practice",texts)
                      await page.screenshot(path=str(pathlib.Path(os.environ["RUNNER_TEMP"])/"qa"/("month-"+name+"-shop.png")),full_page=True)
                      # Actual mouse/touch purchase must debit the player's monthly wallet.
                      await click_laya_label("课本")
                      await page.wait_for_timeout(250)
                      assert any("工资商城 · 余额 ¥2800" in t for t in await read_laya_texts()),(name,"Day10 textbook purchase did not deduct 200")
                      await click_laya_label("离开商城")
                      day20=await fastforward(18240)
                      assert day20["tick"]==18240 and day20["shopDay"]==20 and day20["cash"]==2800,(name,"Day20 shop/carryover event failed",day20)
                      await click_laya_label("运动鞋")
                      await page.wait_for_timeout(250)
                      assert any("工资商城 · 余额 ¥2500" in t for t in await read_laya_texts()),(name,"Day20 shoes purchase did not deduct 300")
                      await click_laya_label("离开商城")
                      day27=await fastforward(24960)
                      assert day27["tick"]==24960 and day27["bossSpawned"] and day27["cash"]==2500,(name,"Day27 boss/cash failed",day27)
                      await page.screenshot(path=str(pathlib.Path(os.environ["RUNNER_TEMP"])/"qa"/("month-"+name+"-boss.png")),full_page=True)
                      final=await fastforward(28800)
                      assert final["ended"] and final["outcome"]=="win" and final["tick"]==28800,(name,"Month end win failed",final)
                      assert final["bossDefeated"] and final["salaryPaid"] and final["cash"]==2500 and final["spent"]==500,(name,"Month milestones or purchases not completed",final)
                      texts=await read_laya_texts()
                      assert any("月底结算：撑过去了" in t for t in texts),(name,"Month actual win screen missing",texts)
                      assert any("练习模式 · 不存档、不发放局外收益" in t for t in texts),(name,"Month payout isolation missing",texts)
                      assert any("本月工资剩余：¥2500" in t for t in texts),(name,"End screen incorrectly shows remaining wages",texts)
                      assert not errors,(name,"browser errors during full-month QA",errors)
                      await page.screenshot(path=str(pathlib.Path(os.environ["RUNNER_TEMP"])/"qa"/("month-"+name+"-end.png")),full_page=True)
                      print(name,"Day10/Day20 shops, Day27 Boss, end at 28800 and no-payout win UI verified",day10,day20,day27,final)
                      await ctx.close()
                  await browser.close()
          asyncio.run(main())
          PY

      - name: Upload non-source browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dagongren-laya-browser-qa
          path: ${{ runner.temp }}/qa
          if-no-files-found: ignore
          retention-days: 7

      - name: Record public, non-source QA evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_TEST_OUTCOME: ${{ steps.source-tests.outcome }}
          LAYA_BUILD_OUTCOME: ${{ steps.laya-build.outcome }}
          BROWSER_QA_OUTCOME: ${{ steps.browser-qa.outcome }}
          STRESS_OUTCOME: ${{ steps.logic-stress.outcome }}
          MONTH_OUTCOME: ${{ steps.month-logic.outcome }}
          ORDINARY_AI_OUTCOME: ${{ steps.ordinary-ai.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa-public"
          python3 - <<'PY'
          import json,os,pathlib,shutil
          from datetime import datetime,timezone
          qa=pathlib.Path(os.environ["RUNNER_TEMP"])/"qa"
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"qa-public"
          names=["desktop.png","desktop-playing.png","desktop-paused.png",
                 "mobile-portrait.png","mobile-portrait-playing.png","mobile-portrait-paused.png",
                 "boss-desktop.png","boss-desktop-charge.png","boss-mobile-portrait.png","boss-mobile-portrait-charge.png",
                 "month-desktop-shop.png","month-desktop-boss.png","month-desktop-end.png",
                 "month-mobile-portrait-shop.png","month-mobile-portrait-boss.png","month-mobile-portrait-end.png"]
          saved=[]
          for name in names:
              p=qa/name
              if p.is_file() and p.stat().st_size>1000 and p.read_bytes()[:8]==b"\x89PNG\r\n\x1a\n":
                  shutil.copy2(p,out/name)
                  saved.append(name)
          month=pathlib.Path(os.environ["RUNNER_TEMP"])/"full-month.json"
          if month.is_file():
              payload=json.loads(month.read_text())
              if payload.get("kind")=="full-month-calendar-and-settlement-logic" and payload.get("ticks")==28800:
                  shutil.copy2(month,out/"full-month.json")
          stress=pathlib.Path(os.environ["RUNNER_TEMP"])/"stress-180s.json"
          if stress.is_file():
              payload=json.loads(stress.read_text())
              if payload.get("kind")=="logic-only-synthetic-stress" and payload.get("steps")==10800:
                  shutil.copy2(stress,out/"stress-180s.json")
          ai=pathlib.Path(os.environ["RUNNER_TEMP"])/"ordinary-ai.json"
          if ai.is_file():
              payload=json.loads(ai.read_text())
              if payload.get("kind")=="ordinary-full-intensity-ai-playtest" and len(payload.get("samples",[]))==42:
                  shutil.copy2(ai,out/"ordinary-ai.json")
          result={
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "source_sha":os.environ.get("SOURCE_SHA",""),
              "workflow_run_id":os.environ.get("GITHUB_RUN_ID",""),
              "source_tests":os.environ["SOURCE_TEST_OUTCOME"],
              "laya_build":os.environ["LAYA_BUILD_OUTCOME"],
              "browser_qa":os.environ["BROWSER_QA_OUTCOME"],
              "logic_stress":os.environ.get("STRESS_OUTCOME","skipped"),
              "ordinary_ai":os.environ.get("ORDINARY_AI_OUTCOME","skipped"),
              "ordinary_ai_report":"ordinary-ai.json" if (out/"ordinary-ai.json").is_file() else None,
              "full_month_qa":os.environ.get("MONTH_OUTCOME","skipped"),
              "full_month_report":"full-month.json" if (out/"full-month.json").is_file() else None,
              "stress_report":"stress-180s.json" if (out/"stress-180s.json").is_file() else None,
              "screenshots":saved,
              "notes":"Desktop/mobile Chromium screenshots include an isolated no-payout accelerated 480-second calendar UI QA. The Node 180-second synthetic stress is CPU logic-only. Neither measures real physical-device FPS or live difficulty."
          }
          (out/"latest.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Public QA evidence:",result)
          PY
          echo "## QA evidence" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/qa-public/latest.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout public preview evidence branch
        if: always()
        uses: actions/checkout@v4
        with:
          repository: BaiMaGod/dagongrenxingcunzhe-preview
          ref: main
          path: preview-evidence
          persist-credentials: true

      - name: Publish sanitized QA report and screenshots into preview repository
        if: always()
        shell: bash
        working-directory: preview-evidence
        run: |
          set -euo pipefail
          mkdir -p qa
          cp "$RUNNER_TEMP/qa-public/latest.json" qa/latest.json
          if [ -s "$RUNNER_TEMP/qa-public/stress-180s.json" ]; then cp "$RUNNER_TEMP/qa-public/stress-180s.json" qa/stress-180s.json; fi
          if [ -s "$RUNNER_TEMP/qa-public/full-month.json" ]; then cp "$RUNNER_TEMP/qa-public/full-month.json" qa/full-month.json; fi
          if [ -s "$RUNNER_TEMP/qa-public/ordinary-ai.json" ]; then cp "$RUNNER_TEMP/qa-public/ordinary-ai.json" qa/ordinary-ai.json; fi
          for name in desktop.png desktop-playing.png desktop-paused.png \
            mobile-portrait.png mobile-portrait-playing.png mobile-portrait-paused.png \
            boss-desktop.png boss-desktop-charge.png boss-mobile-portrait.png boss-mobile-portrait-charge.png \
            month-desktop-shop.png month-desktop-boss.png month-desktop-end.png \
            month-mobile-portrait-shop.png month-mobile-portrait-boss.png month-mobile-portrait-end.png; do
              if [ -s "$RUNNER_TEMP/qa-public/$name" ]; then cp "$RUNNER_TEMP/qa-public/$name" "qa/$name"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa
          if ! git diff --cached --quiet; then
            git commit -m "qa: record verified Chromium screenshots and current run status [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        if: ${{ success() && (github.event_name == 'push' || inputs.publish == true) }}
        uses: actions/configure-pages@v5

      - name: Upload only verified compiled Web to Pages
        if: ${{ success() && (github.event_name == 'push' || inputs.publish == true) }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/game-web

      - name: Deploy GitHub Pages
        if: ${{ success() && (github.event_name == 'push' || inputs.publish == true) }}
        uses: actions/deploy-pages@v4
        id: deploy

      - name: Verify live Pages serves current source commit
        if: ${{ success() && (github.event_name == 'push' || inputs.publish == true) }}
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          MANIFEST_URL="${PAGE_URL%/}/build-manifest.json"
          for i in {1..30}; do
            if curl -fsSL "$MANIFEST_URL" -o "$RUNNER_TEMP/live-manifest.json" && python3 -c 'import json,os,sys; m=json.load(open(sys.argv[1])); sys.exit(0 if m.get("commitSha")==os.environ["SOURCE_SHA"] else 1)' "$RUNNER_TEMP/live-manifest.json"; then
              echo "Published SHA verified: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Live Pages manifest does not match source commit $SOURCE_SHA"
          exit 1
