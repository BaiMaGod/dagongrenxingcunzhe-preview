name: Prepare official headless browser QA runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/render-profile.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned official Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/browser-tools" playwright@1.55.0 --no-audit --no-fund
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install chromium
          mkdir -p "$RUNNER_TEMP/local-qa-runtime"
          cp -a "$RUNNER_TEMP/browser-tools/node_modules" "$RUNNER_TEMP/local-qa-runtime/"
          cp -a "$HOME"/.cache/ms-playwright/chromium_headless_shell-* "$RUNNER_TEMP/local-qa-runtime/"
          tar -C "$RUNNER_TEMP/local-qa-runtime" -czf "$RUNNER_TEMP/official-browser-runtime.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: official-browser-runtime
          path: ${{ runner.temp }}/official-browser-runtime.tar.gz
          retention-days: 1
          compression-level: 0
