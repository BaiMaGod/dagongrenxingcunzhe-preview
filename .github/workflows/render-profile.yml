name: Isolated DPR2 renderer diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/render-profile.yml']
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require read-only token for private source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.DAGONGREN_SOURCE_READ_TOKEN }}
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo "::error::Set DAGONGREN_SOURCE_READ_TOKEN with Contents:Read on private source repo in this public preview repo."
            exit 1
          fi

      - name: Checkout private source without persisting token
        uses: actions/checkout@v4
        with:
          repository: BaiMaGod/dagongrenxingcunzhe
          # V15 dedicated Boss detail, readable action phases and normal-speed browser pacing.
          ref: d7e0fed0670aef2e389a5e9014c9310a73c538d6
          path: private-game
          token: ${{ secrets.DAGONGREN_SOURCE_READ_TOKEN }}
          persist-credentials: false

      - name: Record exact private-source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git -C private-game rev-parse HEAD)"
          test "${#SHA}" -eq 40
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building private game commit $SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Includes the four-corner LayaAir 3.4 drawRoundRect rendering contract guard for every View, including legacy M1.
      - name: Typecheck, game regression and source/template bridge tests
        id: source-tests
        working-directory: private-game
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          python3 tools/test_laya_prepare.py

      - name: Rasterize illustrated combat atlas and synthesize event WAV # painted enemies V11
        id: game-assets
        working-directory: private-game
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir 'cairosvg==2.7.1' 'Pillow==11.3.0'
          python3 tools/render_combat_art.py
          python3 tools/generate_anim_atlas.py
          python3 tools/generate_combat_sfx.py
          test -s assets/art/combat-atlas.webp
          test -s assets/art/actors-motion.webp
          test -s assets/art/boss-rent-motion-v15.webp
          test -s assets/art/combat-motion.webp
          test -s assets/art/city-floor.webp
          for cue in hit kill hurt salary boss boss_down upgrade shot; do
            test -s "assets/audio/$cue.wav"
          done
          echo "Combat atlas, 96 cropped pre-rendered pose frames, city floor and eight event sounds generated" >> "$GITHUB_STEP_SUMMARY"

      - name: Install official LayaAir CLI 3.4.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/layabox/layaair-cli/master/install.sh -o "$RUNNER_TEMP/install-layaair.sh"
          LAYAAIR_INSTALL_DIR="$RUNNER_TEMP/layaair" bash "$RUNNER_TEMP/install-layaair.sh"
          echo "$RUNNER_TEMP/layaair" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/layaair/layaair" install 3.4.0
          "$RUNNER_TEMP/layaair/layaair" --version=3.4.0 create --list-templates | grep -F "2D empty project"

      - name: Create original 2D template, bind game and compile genuine Web build
        id: laya-build
        working-directory: private-game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/official-laya-project"
          layaair --version=3.4.0 create Dagongren -t "2D empty project" -p "$RUNNER_TEMP/official-laya-project"
          echo "=== OFFICIAL 2D TEMPLATE FILES ==="
          find "$RUNNER_TEMP/official-laya-project" -maxdepth 4 -type f | sort | head -130
          echo "=== PLAYER SETTINGS ==="
          cat "$RUNNER_TEMP/official-laya-project/settings/PlayerSettings.json"
          echo "=== PROJECT INIT SETTINGS ==="
          cat "$RUNNER_TEMP/official-laya-project/Dagongren.laya"
          echo "=== COMPILER/STARTUP CANDIDATES ==="
          find "$RUNNER_TEMP/official-laya-project" -type f \( -name '*Compiler*' -o -name '*Main*' -o -name '*.laya' \) | sort
          python3 tools/prepare_laya_project.py --repo "$PWD" --project "$RUNNER_TEMP/official-laya-project"
          layaair --version=3.4.0 build web -p "$RUNNER_TEMP/official-laya-project" -o "$RUNNER_TEMP/game-web"
          test -s "$RUNNER_TEMP/game-web/index.html"
          test -n "$(find "$RUNNER_TEMP/game-web" -type f -name '*.js' -size +0c -print -quit)"
          mkdir -p "$RUNNER_TEMP/game-web/config"
          cp assets/config/mvp-balance.v0.3.json "$RUNNER_TEMP/game-web/config/"
          test -s "$RUNNER_TEMP/game-web/config/mvp-balance.v0.3.json"
          # Asset bytes are packaged only after their actual Git upload.
          # Source PNG/design docs never get copied into public runtime output.
          if [ -s assets/art/actors-atlas.webp ]; then
            mkdir -p "$RUNNER_TEMP/game-web/art"
            cp assets/art/actors-atlas.webp "$RUNNER_TEMP/game-web/art/actors-atlas.webp"
            test -s "$RUNNER_TEMP/game-web/art/actors-atlas.webp"
            echo "Real actor texture atlas included" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Actor atlas absent; view must retain explicitly marked prototype art" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Real combat art/sound assets: generated above from private source assets.
          test -s assets/art/combat-atlas.webp
          test -s assets/art/city-floor.webp
          mkdir -p "$RUNNER_TEMP/game-web/art" "$RUNNER_TEMP/game-web/audio"
          cp assets/art/combat-atlas.webp "$RUNNER_TEMP/game-web/art/"
          cp assets/art/actors-motion.webp "$RUNNER_TEMP/game-web/art/"
          cp assets/art/boss-rent-motion-v15.webp "$RUNNER_TEMP/game-web/art/"
          cp assets/art/combat-motion.webp "$RUNNER_TEMP/game-web/art/"
          cp assets/art/city-floor.webp "$RUNNER_TEMP/game-web/art/"
          cp assets/art/office-scenes-v10.webp "$RUNNER_TEMP/game-web/art/"
          cp assets/art/office-floor-v10.webp "$RUNNER_TEMP/game-web/art/"
          cp assets/art/office-room-v12.webp "$RUNNER_TEMP/game-web/art/"
          test -s "$RUNNER_TEMP/game-web/art/office-floor-v10.webp"
          test -s "$RUNNER_TEMP/game-web/art/office-scenes-v10.webp"
          cp assets/audio/*.wav "$RUNNER_TEMP/game-web/audio/"
          test -s "$RUNNER_TEMP/game-web/art/combat-atlas.webp"
          test -s "$RUNNER_TEMP/game-web/art/actors-motion.webp"
          test -s "$RUNNER_TEMP/game-web/art/combat-motion.webp"
          test -s "$RUNNER_TEMP/game-web/art/city-floor.webp"
          test -s "$RUNNER_TEMP/game-web/audio/kill.wav"

      - name: Configure shipped player and clear default widget requests
        working-directory: private-game
        run: |
          python3 tools/test_finalize_web_build.py
          python3 tools/finalize_web_build.py "$RUNNER_TEMP/game-web"

      - name: Manifest and public artifact hygiene checks
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          output=pathlib.Path(os.environ["RUNNER_TEMP"])/"game-web"
          forbidden=["src","docs","tools",".git","node_modules","private-game"]
          for item in forbidden:
              if (output/item).exists(): raise SystemExit("Private path in Web artifact: "+item)
          manifest={"schemaVersion":1,"commitSha":os.environ["SOURCE_SHA"],"engineVersion":"3.4.0","target":"web"}
          (output/"build-manifest.json").write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")
          assert len(manifest["commitSha"])==40
          print("Staged only Laya Web build from:",manifest["commitSha"])
          PY

      - name: Cache pinned browser and official CJK QA font
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.local/share/fonts
          key: playwright-1.55.0-${{ runner.os }}-noto-cjk-v1

      - name: Install Chromium for actual browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'playwright==1.55.0'
          # Standard Ubuntu runners already include Chrome's native dependencies.
          # Validate the actual launch below instead of downloading unrelated fonts.
          python3 -m playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          if [ ! -s "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf" ]; then
            curl --fail --location --retry 2 "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf" -o "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
            curl --fail --location --retry 2 "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/LICENSE" -o "$HOME/.local/share/fonts/Noto-CJK-LICENSE"
          fi
          fc-cache -f "$HOME/.local/share/fonts"
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page()
              page.set_content("<title>Official browser launch check</title>")
              assert page.title()=="Official browser launch check"
              browser.close()
          PY


      - name: Sequential DPR2 renderer diagnostics, never deployment
        working-directory: private-game
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/browser-tools" playwright@1.55.0 --no-audit --no-fund
          cat > "$RUNNER_TEMP/renderer-probe.cjs" <<'PROBE'
          const libraries=fs.readdirSync(path.join(root,'libs')).filter(x=>x.endsWith('.js')).map(x=>fs.readFileSync(path.join(root,'libs',x),'utf8')).join('');const at=libraries.indexOf('SHADER_NAME TextureFS2D');const fragment=libraries.slice(at,at+3500);const gammaMethod=fragment.includes('.41666')?'srgb':'pow22';console.log('GAMMA_METHOD',gammaMethod,fragment.slice(0,1100));
          const fs=require('fs'),path=require('path'),Module=require('module');
          const variant=process.env.QA_RENDER_VARIANT;
          const root=process.env.GAME_WEB_ROOT,player=path.join(root,'js/index.js');
          const original=fs.readFileSync(player,'utf8'),match=original.match(/JSON\.parse\(\x60([^\x60]+)\x60\)/);
          if(!match)throw Error('Unknown official player');
          const config=JSON.parse(match[1]);let changes={};
          if(variant.includes('no-stencil'))changes.isStencil=false;
          if(variant==='no-ubo'){changes.enableUniformBufferObject=false;changes.matUseUBO=false;}
          if(variant.startsWith('webgl1'))changes.useWebGL2=false;
          Object.assign(config['2D'],changes);
          fs.writeFileSync(player,original.replace(match[0],'JSON.parse('+String.fromCharCode(96)+JSON.stringify(config)+String.fromCharCode(96)+')'));
          const filename=path.resolve('tools/browser_full_run.cjs');
          let source=fs.readFileSync(filename,'utf8').replace('while(Date.now()-began<720000)','while(Date.now()-began<30000)');
          const setup="await p.waitForTimeout(600);\nawait p.evaluate(({v,method})=>{const bg=Laya.stage.getChildByName('battleScenery'),ratio=devicePixelRatio,info={initial:bg.graphics.cmds.map(c=>({type:c.cmdID,texture:c.texture?.bitmap?.constructor?.name,width:c.texture?.width,height:c.texture?.height})),stageColor:Laya.stage.bgColor,accepted:false,method};window.__renderMaterialProbe=info;if(v!=='control'){const x=bg.x,y=bg.y;bg.pos(0,0);const width=Math.ceil((innerWidth+40)*ratio),height=Math.ceil((innerHeight+40)*ratio);const rt=Laya.Sprite.drawToRenderTexture2D(bg,width,height,20,20,undefined,true,undefined,undefined,ratio,ratio);const tex=new Laya.Texture(rt,Laya.Texture.INV_UV);bg.graphics.clear();bg.graphics.drawTexture(tex,-20,-20,innerWidth+40,innerHeight+40);bg.pos(x,y);info.baked=[rt.width,rt.height];if(v.startsWith('gamma-copy')){const pixels=rt.getData(0,0,width,height),table=new Uint8Array(256);for(let i=0;i<256;i++){const f=i/255;table[i]=Math.round(255*(method==='srgb'?(f<=.0031308?f*12.92:1.055*Math.pow(f,.41666)-.055):Math.pow(f,1/2.2)));}let alphaMin=255;for(let i=0;i<pixels.length;i+=4){for(let c=0;c<3;c++)pixels[i+c]=table[pixels[i+c]];alphaMin=Math.min(alphaMin,pixels[i+3]);}const bitmap=new Laya.Texture2D(width,height,Laya.TextureFormat.R8G8B8A8,false,false,false);bitmap.setPixelsData(pixels,false,false);const replacement=new Laya.Texture(bitmap,Laya.Texture.INV_UV);bg.graphics.clear();bg.graphics.drawTexture(replacement,-20,-20,innerWidth+40,innerHeight+40);const m=new Laya.Material();m.setShaderName('Sprite2DTexture');m.blend=v.endsWith('opaque')?Laya.RenderState.BLEND_DISABLE:Laya.RenderState.BLEND_ENABLE_ALL;m.blendSrc=Laya.RenderState.BLENDPARAM_ONE;m.blendDst=Laya.RenderState.BLENDPARAM_ONE_MINUS_SRC_ALPHA;m.blendEquation=Laya.RenderState.BLENDEQUATION_ADD;m.depthTest=Laya.RenderState.DEPTHTEST_OFF;m.depthWrite=false;m.cull=Laya.RenderState.CULL_NONE;m.shaderData.setNumber(Laya.Shader3D.propertyNameToID('u_VertAlpha'),1);m.shaderData.setTexture(Laya.Shader3D.propertyNameToID('u_spriteTexture'),bitmap);m.shaderData.addDefine(Laya.Shader3D.getDefineByName('GAMMATEXTURE'));bg.material=m;info.accepted=bg.material===m;info.alphaMin=alphaMin;}}}, {v:VARIANT,method:GAMMA_METHOD});\nawait p.waitForTimeout(500);\nconsole.log('RENDER_CROP '+VARIANT+' '+(await p.screenshot({type:'jpeg',quality:85,clip:{x:220,y:240,width:150,height:120}})).toString('base64'));\n" .replaceAll('VARIANT',JSON.stringify(variant)).replaceAll('GAMMA_METHOD',JSON.stringify(gammaMethod));
          source=source.replace(" await p.evaluate(()=>{window.__fullRunFrames", " "+setup+" await p.evaluate(()=>{window.__fullRunFrames");
          source=source.replace(" assert(report.renderTiming.withinBudget,", " report.diagnosticOnly=true;report.kind='renderer-diagnostic-only';report.variant="+JSON.stringify(variant)+";report.rendererConfig="+JSON.stringify(changes)+";report.graphics=await p.evaluate(()=>{const c=document.querySelector('canvas'),g=c.getContext('webgl2')||c.getContext('webgl'),d=g.getExtension('WEBGL_debug_renderer_info');return{size:[c.width,c.height],attributes:g.getContextAttributes(),version:g.getParameter(g.VERSION),background:window.__renderMaterialProbe,renderer:d?g.getParameter(d.UNMASKED_RENDERER_WEBGL):null};});return;\n assert(report.renderTiming.withinBudget,");
          source=source.replace("main().catch(e=>", "main().finally(()=>fs.writeFileSync("+JSON.stringify(player)+", "+JSON.stringify(original)+")).catch(e=>");
          const m=new Module(filename,module);m.filename=filename;m.paths=Module._nodeModulePaths(path.dirname(filename));m._compile(source,filename);
          PROBE
          mkdir -p "$RUNNER_TEMP/render-diagnostics"
          for variant in control rebaked-control gamma-copy gamma-copy-opaque; do
            NODE_PATH="$RUNNER_TEMP/browser-tools/node_modules" GAME_WEB_ROOT="$RUNNER_TEMP/game-web" BROWSER_QA_OUT="$RUNNER_TEMP/render-diagnostics/$variant" QA_RENDER_VARIANT="$variant" node "$RUNNER_TEMP/renderer-probe.cjs"
          done
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"render-diagnostics"
          results=[json.loads(p.read_text()) for p in root.glob("*/report.json")]
          summary=[{k:r.get(k) for k in ["sourceCommit","variant","diagnosticOnly","actualGameSeconds","errors","renderTiming","graphics","rendererConfig"]} for r in results]
          (root/"summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-diagnostics
          path: ${{ runner.temp }}/render-diagnostics
          retention-days: 3
